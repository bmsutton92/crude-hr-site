<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crude HR helps Texas and Gulf Coast oilfield, industrial, transportation, and manufacturing businesses replace manual back-office processes with practical automation, custom apps, and fractional HR support. Book a workflow review." />
    <meta name="keywords" content="oilfield workflow automation, Texas field ticketing software, industrial process automation, fractional HR Texas, field-to-finance automation, custom internal apps oilfield" />
    <title>Crude HR | Texas Field Operations &amp; Workflow Automation</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify form definitions. These hidden forms let Netlify detect the forms at deploy time. The React app posts to them with fetch. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <textarea name="process"></textarea>
    </form>
    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
    </form>
    <form name="meeting-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <textarea name="note"></textarea>
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
